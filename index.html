<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#008080">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="90s Legal">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="favicon.ico" sizes="any">
<title>Build a 90s Teenager</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#008080;color:#000;overflow:hidden;touch-action:manipulation;font-family:"MS Sans Serif","Microsoft Sans Serif",Tahoma,Verdana,"Segoe UI",sans-serif;font-size:14px}
button{font-family:inherit}
/* ---------- Windows 95 chrome ---------- */
.win{background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf,3px 3px 0 rgba(0,0,0,.35);padding:3px;display:flex;flex-direction:column;min-height:0}
.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;font-size:13px;padding:3px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:.2px;user-select:none;flex:none}
.title .ic{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;background:linear-gradient(135deg,#ff4fa0 0 50%,#ffe14a 50%);border:1px solid #fff}
.title .ctl{display:flex;gap:2px}
.title .ctl i{display:inline-block;width:18px;height:16px;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;color:#000;font:bold 10px/11px Tahoma,sans-serif;text-align:center}
.btn{font-size:15px;background:#c0c0c0;color:#000;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf;padding:8px 12px;min-height:42px;text-align:left;cursor:pointer;width:100%}
.btn:hover:not(:disabled){background:#d4d4d4}
.btn:active:not(:disabled){border-color:#404040 #fff #fff #404040;box-shadow:inset 1px 1px #808080}
.btn:focus-visible{outline:1px dotted #000;outline-offset:-5px}
.btn:disabled{cursor:default;color:#808080;text-shadow:1px 1px #fff}
.btn.ok{background:#7fe08a;animation:glowok .6s}
.btn.bad{background:#ff8c8c;animation:shake .4s}
.btn.reveal{background:#b8f2bd}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes glowok{50%{box-shadow:0 0 14px 4px #7fe08a}}
.sunk{border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff}
/* ---------- desktop layout ---------- */
#desk{position:fixed;left:0;right:0;top:0;bottom:36px;display:grid;grid-template-columns:minmax(0,1fr) clamp(370px,33vw,520px);gap:12px;padding:12px}
#sceneWin{min-height:0}
#stageBox{flex:1;min-height:0;margin-top:3px;border:2px solid;border-color:#808080 #fff #fff #808080;background:#17131d;position:relative;overflow:hidden}
#scene{width:100%;height:100%;display:block}
#side{display:flex;flex-direction:column;gap:12px;min-height:0}
#statusWin{flex:none}
#statusBody{padding:8px 8px 6px;display:grid;gap:8px}
.stRow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#stageLbl{font-size:13px}#stageLbl b{color:#000080}
#prog{display:flex;gap:2px;padding:3px;height:20px}
#prog span{flex:1;background:#dcdcdc;border:1px solid;border-color:#808080 #fff #fff #808080}
#prog span.done{background:#000080}#prog span.cur{background:#ff4fa0;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.meter{display:flex;align-items:center;gap:6px;font-size:12.5px}
.lamp{width:15px;height:15px;border-radius:50%;border:2px solid #404040;background:#3fe08a;box-shadow:inset -2px -2px 3px rgba(0,0,0,.35),0 0 6px #3fe08a;transition:.3s}
.lamp.hit{background:#ff3b3b;box-shadow:inset -2px -2px 3px rgba(0,0,0,.4),0 0 8px #ff3b3b}
.pip{width:16px;height:16px;border:2px solid;border-color:#fff #404040 #404040 #fff;background:#ffe14a;font:bold 9px/12px Tahoma,sans-serif;text-align:center}
.pip.used{background:#c0c0c0;color:#808080;border-color:#404040 #fff #fff #404040}
#panelWin{flex:1}
#panel{flex:1;min-height:0;overflow:auto;padding:10px 8px 8px}
.unlock{font-size:13px;margin:0 0 6px;color:#222}.unlock b{color:#000080;text-transform:uppercase}
.q{font-size:clamp(17px,1.5vw,22px);font-weight:bold;margin:2px 0 12px;line-height:1.28}
.answers{display:grid;gap:8px}
.msg{font-size:13.5px;margin:10px 0 0;min-height:20px}
.passrow{display:flex;gap:8px;align-items:center;margin-top:12px;border-top:1px solid #808080;padding-top:10px}
.passrow .btn{width:auto;text-align:center;font-weight:bold}
.passrow small{font-size:12px;color:#333}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.head h3{margin:0;font-size:16px}.head h3 small{display:block;font-weight:normal;font-size:12px;color:#444}
.go{width:auto;text-align:center;font-weight:bold;white-space:nowrap;padding:8px 16px}
.go.ready{background:#ffe14a;animation:pulse 1s infinite}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cards.two{grid-template-columns:repeat(2,1fr)}
.card{background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px #808080;padding:3px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
.card:hover{background:#d6d6d6}
.card .thumb{width:100%;height:clamp(92px,13vh,130px);background:repeating-linear-gradient(45deg,#fff8dc 0 8px,#fff1bd 8px 16px);border:1px solid #808080;overflow:hidden}
.cards.two .thumb{height:clamp(130px,22vh,200px)}.cards.tall .thumb{height:clamp(150px,24vh,220px)}
.card .thumb svg{width:100%;height:100%;display:block}
.card .nm{font-size:12.5px;line-height:1.1;text-align:center;min-height:15px}
.card.sel{background:#ffd6ec;outline:3px solid #ff2e93;outline-offset:-2px}
.skins{display:flex;gap:9px;align-items:center;margin:0 0 8px;font-size:13px}
.skins i{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #404040;cursor:pointer;display:inline-block}
.skins i.sel{box-shadow:0 0 0 3px #ff2e93}
/* ---------- taskbar ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:36px;background:#c0c0c0;border-top:2px solid #fff;box-shadow:0 -1px #dfdfdf;display:flex;align-items:center;gap:6px;padding:3px 4px;z-index:40}
#startBtn{display:flex;align-items:center;gap:6px;font-weight:bold;width:auto;min-height:28px;padding:2px 10px}
#startBtn .flag{display:inline-grid;grid-template-columns:1fr 1fr;width:16px;height:16px;gap:1px;transform:skew(-4deg)}
#startBtn .flag b:nth-child(1){background:#f35325}#startBtn .flag b:nth-child(2){background:#81bc06}#startBtn .flag b:nth-child(3){background:#05a6f0}#startBtn .flag b:nth-child(4){background:#ffba08}
.task{flex:0 1 240px;min-height:28px;padding:2px 8px;font-size:13px;border:2px solid;border-color:#404040 #fff #fff #404040;background:repeating-conic-gradient(#fff 0 25%,#c0c0c0 0 50%) 0 0/2px 2px;font-weight:bold;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
#tray{margin-left:auto;display:flex;align-items:center;gap:8px;border:2px solid;border-color:#808080 #fff #fff #808080;padding:2px 10px;min-height:28px;font-size:13px}
#startMenu{position:fixed;left:4px;bottom:38px;z-index:45;display:none;width:220px;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:3px 3px 0 rgba(0,0,0,.4);padding:3px 3px 3px 30px;position:fixed}
#startMenu::before{content:"Windows 97";position:absolute;left:2px;top:2px;bottom:2px;width:26px;background:linear-gradient(0deg,#000080,#1084d0);color:#fff;font:bold 13px Tahoma,sans-serif;writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;padding:6px 4px;letter-spacing:1px;white-space:nowrap}
#startMenu{min-height:96px}#startMenu.show{display:block}
#startMenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 8px;font-size:14px;cursor:pointer}
#startMenu button:hover{background:#000080;color:#fff}
#startMenu hr{border:0;border-top:1px solid #808080;border-bottom:1px solid #fff;margin:2px 0}
@media (min-aspect-ratio:1/1){
 #sceneWin{align-self:center;justify-self:center;width:min(100%,calc((100vh - 112px)*1.5385 + 10px))}
 #stageBox{flex:none;aspect-ratio:800/520;width:100%}
}
/* ---------- phones / portrait ---------- */
@media (max-aspect-ratio:1/1){
 .mcard{left:50%;transform:translateX(-50%);width:min(94vw,620px);animation-name:rise2p}
 @keyframes rise2p{from{opacity:0;transform:translate(-50%,30px)}}
 #desk{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:8px;padding:6px}
 #stageBox{flex:none;aspect-ratio:800/520;width:100%}
 .coverbox{bottom:128px}.wbar{height:128px;gap:6px}.wbar .btn{flex:1 1 auto;min-height:44px;font-size:13px;padding:6px 8px;white-space:nowrap}.spread{padding-bottom:150px}
 #sceneWin .title .ctl{display:none}
 #sceneWin{width:100%}
 #side{gap:8px}
 #statusBody{padding:5px 6px 4px;gap:5px}
 .q{font-size:16px;margin-bottom:8px}.btn{font-size:14.5px;min-height:40px;padding:6px 10px}
 .card .thumb{height:78px}.cards.two .thumb,.cards.tall .thumb{height:120px}
 .cards{grid-template-columns:repeat(3,1fr);gap:6px}
 #taskbar .task{display:none}
}
@media (max-height:640px) and (max-aspect-ratio:1/1){#taskbar{display:none}#desk{bottom:0}}
@media (max-width:480px){.win{box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf}.title{font-size:12px}}
/* ---------- scene animation ---------- */
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:popin .75s cubic-bezier(.2,1.6,.4,1) both}
@keyframes popin{0%{opacity:0;transform:scale(.45) translateY(-24px)}100%{opacity:1;transform:none}}
.fadein{animation:fadein 1s both}@keyframes fadein{from{opacity:0}}
#r-charIn{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:scaleY(1.006)}}
#r-charB{transform-box:fill-box;transform-origin:50% 100%}
#r-charB.boing{animation:boing .5s}
@keyframes boing{30%{transform:scale(1.04,.96)}60%{transform:scale(.98,1.025)}}
.blob{animation:rise 5s ease-in-out infinite}.blob.b2{animation-duration:7s;animation-delay:-2s}.blob.b3{animation-duration:6s;animation-delay:-4s}
@keyframes rise{0%,100%{transform:translateY(9px)}50%{transform:translateY(-16px)}}
.tw{animation:tw 2.6s ease-in-out infinite}@keyframes tw{50%{opacity:.3}}
.flick{animation:flick 3s steps(1) infinite}@keyframes flick{0%{opacity:1}40%{opacity:.86}44%{opacity:1}80%{opacity:.92}}
.fil{animation:fil 1.2s steps(1) infinite}@keyframes fil{0%{opacity:1}30%{opacity:.15}60%{opacity:.9}80%{opacity:.4}}
.hue{animation:hue 8s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
.eq{animation:eq .9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes eq{50%{transform:scaleY(2.4)}}
.noise{animation:noise .25s steps(2) infinite}@keyframes noise{50%{transform:translate(2px,3px)}}
#stageBox.glitch{animation:glitch .6s steps(2)}
@keyframes glitch{0%{filter:none}15%{filter:hue-rotate(90deg) saturate(2.5);transform:translate(-6px,2px)}30%{filter:invert(.25);transform:translate(7px,-3px)}50%{filter:hue-rotate(200deg) contrast(1.6);transform:translate(-4px,0)}75%{filter:saturate(0) contrast(1.4);transform:translate(3px,2px)}100%{filter:none;transform:none}}
#stageBox .scanflash{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 2px,transparent 2px 5px);opacity:0}
#stageBox.glitch .scanflash{animation:sf .6s}@keyframes sf{0%,100%{opacity:0}30%{opacity:1}}
/* ---------- full-screen endings ---------- */
#finale{position:fixed;inset:0;z-index:60;background:#000;display:none;overflow:hidden}
#finale.show{display:block}
.crt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(#0a2a2a,#000);text-align:center}
.crt::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,transparent 2px 4px);pointer-events:none}
.welcome{font:900 clamp(40px,10vw,120px)/1.02 Impact,"Arial Black",sans-serif;color:#7dffea;text-shadow:4px 0 #ff2e93,-4px 0 #2b6bff,0 0 26px #00ffd5;letter-spacing:3px;animation:gl 1.1s steps(2) infinite}
@keyframes gl{0%{transform:translate(0)}20%{transform:translate(-4px,1px)}40%{transform:translate(4px,-1px);filter:hue-rotate(40deg)}60%{transform:translate(0)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70}
#flash.go{animation:fl .7s}@keyframes fl{0%{opacity:1}100%{opacity:0}}
/* win stage */
.wstage{position:absolute;inset:0;overflow:hidden;background:#12002b}
.rays{position:absolute;left:50%;top:50%;width:230vmax;height:230vmax;margin:-115vmax 0 0 -115vmax;background:repeating-conic-gradient(var(--c1) 0 7.5deg,var(--c2) 7.5deg 15deg);animation:spin 26s linear infinite;opacity:.9}
@keyframes spin{to{transform:rotate(360deg)}}
.wstage::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 25%,rgba(10,0,30,.75) 100%);pointer-events:none}
.coverbox{position:absolute;left:0;right:0;top:12px;bottom:84px;display:flex;align-items:center;justify-content:center;perspective:1200px;z-index:3}
.cover-wrap{height:100%;max-width:100%;aspect-ratio:3/4;position:relative;animation:spinin 1.5s cubic-bezier(.15,.8,.25,1) both,float 4.5s ease-in-out 1.6s infinite;filter:drop-shadow(0 14px 30px rgba(0,0,0,.7))}
@keyframes spinin{0%{transform:scale(.04) rotate(-1080deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(-1.5deg)}}
@keyframes float{0%,100%{transform:rotate(-1.5deg) translateY(0)}50%{transform:rotate(1deg) translateY(-8px)}}
.cover-wrap svg{width:100%;height:100%;display:block;border:3px solid #fff;outline:2px solid #000;background:#fff}
.holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.7) 44%,rgba(120,255,240,.5) 50%,rgba(255,120,240,.5) 56%,transparent 72%);background-size:260% 100%;animation:holo 3.2s linear 1.6s infinite}
@keyframes holo{0%{background-position:130% 0}100%{background-position:-130% 0}}
.confetti{position:absolute;top:-4vh;width:10px;height:16px;z-index:4;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(900deg)}}
.pf{position:absolute;width:30vmin;height:30vmin;margin:-15vmin 0 0 -15vmin;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.8) 18%,rgba(255,255,255,0) 62%);z-index:5;pointer-events:none;animation:pf .5s ease-out both}
@keyframes pf{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.6);opacity:0}}
.wbar{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:6;padding:8px;opacity:0;animation:fadeup .8s 3.2s both}
@keyframes fadeup{from{opacity:0}to{opacity:1}}
.wbar .btn{width:auto;text-align:center;font-weight:bold;min-height:46px;padding:8px 18px;font-size:16px}
.wbar .btn.hot{background:#ffe14a}
.spread{position:absolute;inset:0;overflow:auto;background:#008080;padding:14px 14px 100px;-webkit-overflow-scrolling:touch}
.spreadIn{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
@media (max-aspect-ratio:1/1){.spreadIn{grid-template-columns:1fr}}
.page{background:#fffdf5;border:3px solid #fff;outline:2px solid #000;box-shadow:6px 6px 0 rgba(0,0,0,.4);padding:14px;position:relative}
.page h2{font:900 clamp(22px,3vw,34px)/1 Impact,"Arial Black",sans-serif;margin:0 0 4px;color:#d6306e;text-shadow:2px 2px 0 #ffe14a;letter-spacing:1px}
.page .kick{font:bold 12px Arial,sans-serif;letter-spacing:2px;color:#000080;margin-bottom:10px}
.poster{position:relative;border:6px solid #fff;box-shadow:0 0 0 1px #000,0 8px 18px rgba(0,0,0,.45);transform:rotate(-1deg);background:#000}
.poster svg{width:100%;display:block}
.poster::before,.poster::after{content:"";position:absolute;top:-10px;width:64px;height:22px;background:rgba(240,228,160,.85);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.poster::before{left:-18px;transform:rotate(-35deg)}.poster::after{right:-18px;transform:rotate(35deg)}
.tribe{background:#ffe14a;border:3px solid #000;padding:10px 12px;margin:0 0 12px;transform:rotate(1deg)}
.tribe b{display:block;font:900 clamp(24px,3vw,36px)/1 Impact,"Arial Black",sans-serif;color:#d6306e;text-shadow:2px 2px 0 #fff}
.facts p{margin:0 0 8px;font-size:15px;line-height:1.35}.facts b{color:#000080}
.tick{font:bold 11px Arial,sans-serif;letter-spacing:1.5px;color:#666;margin-top:10px}
/* lose */
.lstage{position:absolute;inset:0;overflow:hidden;background:#05010f}
.tunnel{position:absolute;left:50%;top:50%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(from 0deg,#0a0420 0 6deg,#3b1fd8 6deg 9deg,#0a0420 9deg 15deg,#ff2ee6 15deg 17deg);animation:spin 1.3s linear infinite}
.rings{position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 0 40px,rgba(120,255,255,.35) 42px 46px,rgba(0,0,0,.0) 48px 90px);animation:rz 1s linear infinite}
@keyframes rz{from{background-size:100% 100%;transform:scale(1)}to{transform:scale(2.4);opacity:.2}}
.lstage::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 8%,rgba(0,0,0,.85) 75%)}
.suck{position:absolute;left:50%;top:50%;width:min(38vh,60vw);height:min(70vh,100vw);margin:calc(min(70vh,100vw)/-2) 0 0 calc(min(38vh,60vw)/-2);z-index:3;animation:suck 2.7s cubic-bezier(.6,0,.9,.4) both}
.suck svg{width:100%;height:100%}
@keyframes suck{0%{transform:scale(1) rotate(0);filter:blur(0)}70%{filter:blur(1px)}100%{transform:scale(0) rotate(1260deg);filter:blur(6px)}}
.lmsg{position:absolute;left:0;right:0;top:44%;text-align:center;z-index:4;font:900 clamp(26px,6vw,64px)/1 Impact,"Arial Black",sans-serif;color:#fff;text-shadow:3px 0 #ff2ee6,-3px 0 #22d3ee;letter-spacing:3px;animation:gl .5s steps(2) infinite}
.modern{position:absolute;inset:0;background:#dfe1e8;animation:fadein 1s both;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.modern svg.mr{position:absolute;inset:0;width:100%;height:100%}
.mcard{position:absolute;left:3vw;bottom:4vh;width:min(46vw,540px);background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-radius:22px;padding:20px 22px;box-shadow:0 18px 50px rgba(20,20,60,.4);color:#14141c;animation:rise2c .8s .6s both}
@keyframes rise2c{from{opacity:0;transform:translateY(30px)}}
.mcard h1{margin:0 0 4px;font-size:clamp(22px,3.2vw,32px);letter-spacing:-.5px}
.mcard p{margin:6px 0;font-size:15px;line-height:1.4;color:#3a3a4a}
.mcard .stat{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.mcard .chip{background:#eef0f7;border-radius:999px;padding:5px 12px;font-size:13px;color:#2a2a3a}
.mcard button{font:600 16px system-ui,sans-serif;border:0;border-radius:999px;padding:13px 26px;color:#fff;background:linear-gradient(90deg,#6a5cff,#ff3df2);cursor:pointer;box-shadow:0 6px 18px rgba(106,92,255,.5)}
.mcard button:hover{filter:brightness(1.08)}
.notif{position:absolute;right:3vw;top:3vh;z-index:5;background:rgba(255,255,255,.92);border-radius:16px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px;color:#222;max-width:260px;animation:rise3 .6s 1.4s both}
@keyframes rise3{from{opacity:0;transform:translateY(20px)}}

/* ---------- notation ---------- */
.mx{font-family:"Times New Roman",Cambria,"Cambria Math",serif;font-size:1.08em;white-space:nowrap}
.mx i{font-style:italic}.mx sup,.mx sub{font-size:.7em;line-height:0}
.mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em}
.mn{border-bottom:1px solid currentColor;padding:0 .2em .04em}.md{padding:.04em .2em 0}
.ms{white-space:nowrap}.ms .mr{border-top:1px solid currentColor;padding:0 .12em;margin-left:-.02em}.mrt{font-size:.6em}

function plainH(s){return escH(s).replace(/\n/g,'<br>')}

function scanNum(str){
  let t=String(str).replace(/[\u2212\u2013\u2014]/g,'-').replace(/\u00d7/g,'x').replace(/(\d),(?=\d{3}(?!\d))/g,'$1').trim();
  t=t.replace(/^[A-Za-z\u0370-\u03ff]+\s*=\s*/,'');
  let m=t.match(/^([+-]?\s*(?:\d+\.?\d*|\.\d+))\s*(?:x|\*|times)\s*10\s*\^?\s*\{?\s*([+-]?\d+)\s*\}?/i);

  m=t.match(/^([+-]?\s*(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?)/i);
  if(!m)return null;
  let n=parseFloat(m[1].replace(/\s/g,'')),rest=t.slice(m[0].length);
  const fr=rest.match(/^\s*\/\s*(\d+\.?\d*)(?![A-Za-z])/);

function lev(a,b){

function hexToRgb(h){const n=parseInt(h.slice(1),16);return[n>>16,(n>>8)&255,n&255]}
function toHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}

/* ---------- smooth path helpers (Catmull-Rom -> cubic Bezier) ---------- */
function segs(pts,closed){
  const n=pts.length,out=[];
  const g=i=>closed?pts[((i%n)+n)%n]:pts[Math.max(0,Math.min(n-1,i))];
  const cnt=closed?n:n-1;
  for(let i=0;i<cnt;i++){
    const a=g(i-1),b=g(i),c=g(i+1),d=g(i+2);
    out.push('C'+f(b[0]+(c[0]-a[0])/6)+' '+f(b[1]+(c[1]-a[1])/6)+' '+f(c[0]-(d[0]-b[0])/6)+' '+f(c[1]-(d[1]-b[1])/6)+' '+f(c[0])+' '+f(c[1]));
  }
  return out.join('');
}
const Mv=p=>'M'+f(p[0])+' '+f(p[1]);
const Lv=p=>'L'+f(p[0])+' '+f(p[1]);

const PROF={

};
function hwAt(g,y){const p=PROF[g];if(y<=p[0][0])return p[0][1];for(let i=0;i<p.length-1;i++){if(y<=p[i+1][0]){return lerp(p[i][1],p[i+1][1],(y-p[i][0])/(p[i+1][0]-p[i][0]))}}return p[p.length-1][1]+(y-p[p.length-1][0])*.12}
function torsoPath(g,y0,y1,pad,flare){
  pad=pad||0;flare=flare||0;
  const ys=[y0].concat(PROF[g].map(p=>p[0]).filter(y=>y>y0+2&&y<y1-2),[y1]);
  const s=ys.map((y,i)=>[y,hwAt(g,y)+pad+(i===ys.length-1?flare:0)]);
  const Lp=s.map(a=>[100-a[1],a[0]]),Rp=s.map(a=>[100+a[1],a[0]]);
  return Mv(Lp[0])+segs(Lp,false)+Lv(Rp[Rp.length-1])+segs(Rp.slice().reverse(),false)+'Z';
}
function dense(ch,n){n=n||3;const P=[],W=[];for(let i=0;i<ch.p.length-1;i++)for(let k=0;k<n;k++){const t=k/n;P.push([lerp(ch.p[i][0],ch.p[i+1][0],t),lerp(ch.p[i][1],ch.p[i+1][1],t)]);W.push(lerp(ch.w[i],ch.w[i+1],t))}P.push(ch.p[ch.p.length-1]);W.push(ch.w[ch.w.length-1]);return{P,W}}
function limb(ch,o){
  o=o||{};const t0=o.t0||0,t1=o.t1==null?1:o.t1,wadd=o.wadd||0,wmul=o.wmul||1,flare=o.flare||0;
  const D=dense(ch),P=D.P,W=D.W,N=P.length;
  const i0=Math.round(t0*(N-1)),i1=Math.max(i0+1,Math.round(t1*(N-1)));
  const Lp=[],Rp=[];let tx=0,ty=0;
  for(let i=i0;i<=i1;i++){
    const a=P[Math.max(0,i-1)],b=P[Math.min(N-1,i+1)];
    tx=b[0]-a[0];ty=b[1]-a[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
    const nx=-ty,ny=tx,pr=(i-i0)/Math.max(1,i1-i0),w=(W[i]*wmul+wadd+flare*pr*pr)/2;
    Lp.push([P[i][0]+nx*w,P[i][1]+ny*w]);Rp.push([P[i][0]-nx*w,P[i][1]-ny*w]);
  }
  if(o.flatEnd){const a0=P[i0],a1=P[Math.min(N-1,i0+1)];let sx=a1[0]-a0[0],sy=a1[1]-a0[1];const sl=Math.hypot(sx,sy)||1;sx/=sl;sy/=sl;const wS=(W[i0]*wmul+wadd)/2;const s0=[a0[0]-sx*wS*1.25,a0[1]-sy*wS*1.25];
    return Mv(Lp[0])+segs(Lp,false)+Lv(Rp[Rp.length-1])+segs(Rp.slice().reverse(),false)+'Q'+f(s0[0])+' '+f(s0[1])+' '+f(Lp[0][0])+' '+f(Lp[0][1])+'Z'}
  if(o.flat)return Mv(Lp[0])+segs(Lp,false)+Lv(Rp[Rp.length-1])+segs(Rp.slice().reverse(),false)+'Z';
  const wE=(W[i1]*wmul+wadd)/2,wS=(W[i0]*wmul+wadd)/2;
  const e=[P[i1][0]+tx*wE*.9,P[i1][1]+ty*wE*.9];
  const a0=P[i0],a1=P[Math.min(N-1,i0+1)];let sx=a1[0]-a0[0],sy=a1[1]-a0[1];const sl=Math.hypot(sx,sy)||1;sx/=sl;sy/=sl;
  const s0=[a0[0]-sx*wS*.9,a0[1]-sy*wS*.9];
  return closedPath(Lp.concat([e],Rp.slice().reverse(),[s0]));
}

/* ---------- arms ---------- */
function armsSVG(st,g,skin,spec){
  const pose=POSES[st.pose||'cool'],L=pose.L,R=pose.R||mir(pose.L),hL=pose.hL||'rest',hR=pose.hR||'rest';
  const sl=spec&&spec.sleeve;
  const sk=d=>`<path d="${d}" fill="${skin}"/><path d="${d}" fill="url(#cylH)"/>`;
  const one=(pts,hand,side)=>{
    const ch=armCh(pts,g);let o='';
    o+=sk(limb(ch,{}));
    o+=handSVG(hand,pts[1],pts[2],skin,side);
    if(sl){
      const t1=sl.t1<.9?sl.t1+.1:sl.t1;
      o+=`<path d="${limb(ch,{t0:0,t1:t1,wadd:sl.wadd,flatEnd:true})}" fill="${sl.fill}"/><path d="${limb(ch,{t0:0,t1:t1,wadd:sl.wadd,flatEnd:true})}" fill="url(#cylH)"/>`;
      if(sl.cuff){o+=`<path d="${limb(ch,{t0:Math.max(0,t1-.07),t1:t1,wadd:sl.wadd+.8,flat:true})}" fill="${sl.cuff}"/>`}
      if(sl.stripe){o+=`<path d="${limb(ch,{t0:.3,t1:.97,wadd:-7,flat:true})}" fill="${sl.stripe}" opacity=".95"/>`}
    }
    return o;
  };
  let o=one(L,hL,-1)+one(R,hR,1);
  if(st.acc==='scrunchie')o+=braceletScrunchie(L,g);
  return o;
}

let AC=null,muted=false;

function tone(fr,t0,dur,type,vol){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.value=fr;const t=a.currentTime+t0;g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function sweep(f0,f1,dur,type,vol){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sawtooth';const t=a.currentTime;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol){const a=ac();if(!a||muted)return;const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();g.gain.value=vol||.2;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}

function renderRoom(instant){

function renderChar(boing){

/* ---------- quiz ---------- */
function nextQuestion(){
  if(!deck.length){deck=shuffle(BANK.map((_,i)=>i));if(deck[0]===curIdx&&deck.length>1)deck.push(deck.shift())}
  curIdx=deck.shift();return BANK[curIdx];
}
function showQuestion(){
  if(gameOver)return;
  const st=STAGES[stage];
  curQ=nextQuestion();
  const typed=curQ.t==='num'||curQ.t==='txt';
  const img=curQ.img?`<div class="qimg"><img id="qimg" src="${curQ.img}" alt="Picture for this question" title="Click to enlarge"></div>`:'';
  let ans;
  if(typed){
    ans=`<div class="typed"><input id="typ" class="tin" type="text" inputmode="${curQ.t==='num'?'text':'text'}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="${curQ.t==='num'?'Type a number':'Type your answer'}"><button class="btn go" id="typGo">Submit</button></div><div class="tinhint">${curQ.t==='num'?'Enter a number. Units are optional, and 3e8 or 3 x 10^8 both work.':'Type a short answer. Capitals and punctuation do not matter.'}</div>`;
  }else ans='<div class="answers" id="ans"></div>';
  $('#panelTitle').textContent='Quiz.exe';
  $('#panel').innerHTML=`<p class="unlock">Answer correctly to unlock: <b>${st.name}</b></p>${img}<div class="q">${fmt(curQ.q)}</div>${ans}<div class="msg" id="msg">&nbsp;</div>
  <div class="passrow"><button class="btn" id="passBtn" ${passes<1?'disabled':''}>Pass &#9654;&#9654;</button><small>${passes>0?`${passes} pass${passes>1?'es':''} left &ndash; a passed question comes back later`:'No passes left'}</small></div>`;
  if(curQ.img)$('#qimg').onclick=()=>lightbox(curQ.img);
  if(typed){
    const inp=$('#typ');$('#typGo').onclick=submitTyped;
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submitTyped()}};
    if(window.matchMedia&&matchMedia('(pointer:fine)').matches)setTimeout(()=>inp.focus(),60);
  }else{
    const box=$('#ans');
    const tf=curQ.a.length===2&&curQ.a.every(x=>/^(true|false)$/i.test(x.trim()));
    const opts=shuffle(curQ.a.map((t,i)=>({t,ok:i===curQ.c})));
    opts.forEach((o,i)=>{
      const b=document.createElement('button');b.className='btn';b.innerHTML=(tf?'':String.fromCharCode(65+i)+'.&nbsp; ')+fmt(o.t);
      b.onclick=()=>answer(o,b,opts);box.appendChild(b);
    });
  }
  $('#passBtn').onclick=usePass;
  renderStatus();
}
function usePass(){
  if(passes<1||gameOver)return;
  passes--;sfx.pass();
  deck.splice(Math.min(deck.length,2+Math.floor(Math.random()*5)),0,curIdx);
  showQuestion();
  $('#msg').innerHTML='Passed. That question will come back later.';
}
function resolveOk(){
  sfx.ok();
  $('#msg').innerHTML='<b>Correct!</b> You unlocked a choice&hellip;';
  setTimeout(showChoice,900);
}
function resolveBad(revealHTML){
  strikes++;renderStatus();
  const sb=$('#stageBox');sb.classList.remove('glitch');void sb.offsetWidth;sb.classList.add('glitch');sfx.glitch();sfx.no();
  if(strikes>=MAX_STRIKES){
    gameOver=true;
    $('#msg').innerHTML=`<b>Time-slip!</b> ${revealHTML} The 1990s are slipping away&hellip;`;
    setTimeout(loseScene,1900);
  }else{
    const left=MAX_STRIKES-strikes;
    $('#msg').innerHTML=`<b>Not quite.</b> ${revealHTML} ${left} more wrong answer${left>1?'s':''} and you'll be pulled back to the 2020s!<br><button class="btn go" id="nextq" style="margin-top:10px;width:100%;text-align:center">Next question &#9654;</button>`;
    $('#nextq').onclick=showQuestion;
  }
}
function answer(o,b,opts){
  const btns=$$('#ans .btn');btns.forEach(x=>x.disabled=true);$('#passBtn').disabled=true;
  if(o.ok){b.classList.add('ok');resolveOk()}
  else{b.classList.add('bad');btns[opts.findIndex(x=>x.ok)].classList.add('reveal');resolveBad('The correct answer is highlighted.')}
}
function submitTyped(){
  const inp=$('#typ');if(!inp||inp.disabled)return;
  const v=inp.value.trim();if(!v)return;
  let ok;
  if(curQ.t==='num'){
    const r=scanNum(v);
    if(!r){$('#msg').innerHTML='That does not look like a number. Have another go (units are optional). <b>No penalty.</b>';inp.focus();return}
    ok=numOK(r.n,curQ);
  }else ok=txtOK(v,curQ.acc,GD.fuzzy);
  inp.disabled=true;$('#typGo').disabled=true;$('#passBtn').disabled=true;
  inp.classList.add(ok?'ok':'bad');
  if(ok)resolveOk();
  else resolveBad(`The answer was <b>${curQ.t==='num'?fmt(curQ.show):curQ.acc.map(fmt).join(' <i>or</i> ')}</b>.`);
}
function lightbox(src){

function winScene(){
  const f0=$('#finale');f0.className='show';
  f0.innerHTML='<div class="crt"><div class="welcome">WELCOME TO<br>1997</div></div>';
  sfx.modem();
  setTimeout(()=>{sfx.shutter();const fl=$('#flash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go')},2300);
  setTimeout(coverStage,2450);
}
function coverStage(){
  const info=buildInfo();window._info=info;
  const cols=['#ff2e93','#ffe14a','#7dffea','#ffffff','#7b2dff','#ff7a3d'];
  let conf='';for(let i=0;i<64;i++){conf+=`<i class="confetti" style="left:${f(Math.random()*100)}%;background:${pick(cols)};animation-duration:${f(3+Math.random()*4)}s;animation-delay:${f(Math.random()*5)}s;width:${6+Math.floor(Math.random()*8)}px"></i>`}
  $('#finale').innerHTML=`<div class="wstage" style="--c1:${info.pal[0]};--c2:${info.pal[1]}"><div class="rays"></div>${conf}
   <div class="coverbox"><div class="cover-wrap">${coverSVG(info)}<div class="holo"></div></div></div>
   <div class="wbar"><button class="btn hot" id="bOpen">Open magazine &#9654;</button><button class="btn" id="bSave">Save cover</button><button class="btn" id="bAgain">Build another</button></div></div>`;
  sfx.win();
  [300,900,1500,2100,2700].forEach((t,i)=>setTimeout(()=>{const w=$('.wstage');if(!w)return;const p=document.createElement('i');p.className='pf';p.style.left=f(10+Math.random()*80)+'%';p.style.top=f(10+Math.random()*70)+'%';w.appendChild(p);sfx.shutter();setTimeout(()=>p.remove(),700)},t));
  $('#bOpen').onclick=()=>openMag(info);$('#bSave').onclick=saveCover;$('#bAgain').onclick=()=>start();
}
function saveCover(){
  const svg=$('#coverSvg');if(!svg)return;
  const xml=new XMLSerializer().serializeToString(svg),img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=1200;c.height=1600;const x=c.getContext('2d');x.drawImage(img,0,0,1200,1600);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-90s-teenager.png';document.body.appendChild(a);a.click();a.remove()})};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
}
function openMag(info){
  const room=$('#scene').cloneNode(true);room.removeAttribute('id');room.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
  room.setAttribute('viewBox','0 0 800 520');
  $('#finale').innerHTML=`<div class="spread"><div class="spreadIn">
   <div class="page"><div class="kick">CENTREFOLD \u2022 FREE POSTER</div><h2>YOUR BEDROOM TOUR</h2><div class="poster">${room.outerHTML}</div><div class="tick">${info.name.toUpperCase()}'S ROOM, 1997. DO NOT TOUCH THE LAVA LAMP.</div></div>
   <div class="page"><div class="kick">FACT FILE \u2022 ${info.name.toUpperCase()}, ${info.age}</div>
    <div class="tribe">Which 90s tribe are you?<b>${info.tribe.n}</b>${info.tribe.b}</div>
    <div class="facts"><p><b>Signature look:</b> ${NAMES.hair[S.hair]} + ${NAMES.top[S.top]} + ${NAMES.bottom[S.bottom]} + ${NAMES.shoes[S.shoes]}</p><p><b>Current obsession:</b> ${OBSESS[S.tech]}</p><p><b>Most prized possession:</b> ${PRIZED[S.poss]}</p><p><b>Major concern:</b> ${info.concern}</p><p><b>Life goal:</b> ${info.goal}</p></div></div>
  </div></div>
  <div class="wbar" style="animation-delay:.3s;background:linear-gradient(0deg,#008080 60%,transparent)"><button class="btn" id="bBack">&#9664; Back to the cover</button><button class="btn" id="bSave">Save cover</button><button class="btn hot" id="bAgain">Build another</button></div>`;
  $('#bBack').onclick=()=>{coverReshow(info)};$('#bAgain').onclick=()=>start();
  $('#bSave').onclick=()=>{ $('#finale').insertAdjacentHTML('beforeend','<div style="position:absolute;left:-9999px">'+coverSVG(info)+'</div>');saveCover();};
}
function coverReshow(info){
  $('#finale').innerHTML=`<div class="wstage" style="--c1:${info.pal[0]};--c2:${info.pal[1]}"><div class="rays"></div><div class="coverbox"><div class="cover-wrap" style="animation:float 4.5s ease-in-out infinite">${coverSVG(info)}<div class="holo" style="animation-delay:0s"></div></div></div><div class="wbar" style="animation-delay:0s"><button class="btn hot" id="bOpen">Open magazine &#9654;</button><button class="btn" id="bSave">Save cover</button><button class="btn" id="bAgain">Build another</button></div></div>`;
  $('#bOpen').onclick=()=>openMag(info);$('#bSave').onclick=saveCover;$('#bAgain').onclick=()=>start();
}

function modernStage(){
  const done=STAGES.slice(0,stage).map(s=>S[s.k]?NAMES[s.k][S[s.k]]:null).filter(Boolean).filter(n=>!['Male','Female'].includes(n));
  const shown=done.slice(-4);
  const unread=180+Math.floor(Math.random()*320),hrs=(6+Math.random()*7).toFixed(1);
  const quips=[['Wi-Fi: connected. Lava lamps: 0.'],['Mixtapes: replaced by a playlist nobody asked for.'],['Phone battery: 4%. Charger: lost.'],['Group chat: 214 unread. Nothing important.']];
  $('#finale').innerHTML=`<div class="modern"><svg class="mr" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice">${modernRoomSVG(S)}</svg>
   <div class="notif"><b>Screen Time</b><br>Daily average up ${Math.floor(Math.random()*30+20)}%. You've picked up your phone ${unread} times.</div>
   <div class="mcard"><h1>Back in the 2020s.</h1><p>The portal snapped shut. ${pick(quips)[0]}</p>
   <div class="stat"><span class="chip">Stage reached: ${stage} of ${TOTAL}</span><span class="chip">Screen time today: ${hrs} h</span>${shown.length?`<span class="chip">Unfinished 90s look: ${shown.join(' + ')}</span>`:''}</div>
   <button id="tryAgain">Travel back and try again</button></div></div>`;
  $('#tryAgain').onclick=()=>start();
}
